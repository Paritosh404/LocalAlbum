name: LocationAlbums
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  LocationAlbums:
    type: application
    platform: iOS
    sources:
      - LocationAlbums
    info:
      path: LocationAlbums/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LocationAlbums
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1

