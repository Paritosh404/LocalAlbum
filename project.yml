name: LocationAlbums
options:
  createIntermediateGroups: true
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  LocationAlbums:
    type: application
    platform: iOS
    sources:
      - path: LocationAlbums
        excludes:
          - Resources
      - path: LocationAlbums/Resources
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: LocationAlbums/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Location Albums
        CFBundleShortVersionString: "1.10"
        CFBundleVersion: "12"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: Location Albums needs access to organize photos, videos, and other media using their saved GPS location.
        NSPhotoLibraryAddUsageDescription: Location Albums needs permission to add your existing media to location albums.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LocationAlbums
        PRODUCT_NAME: LocationAlbums
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
