name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated privacy keys
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" LocationAlbums/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" LocationAlbums/Info.plist

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project LocationAlbums.xcodeproj \
            -scheme LocationAlbums \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify built app privacy keys
        run: |
          APP_PLIST="build/Build/Products/Release-iphoneos/LocationAlbums.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$APP_PLIST"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LocationAlbums.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built .app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry LocationAlbums-v1.7.1-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocationAlbums-v1.7.1-unsigned-ipa
          path: LocationAlbums-v1.7.1-unsigned.ipa
          if-no-files-found: error
